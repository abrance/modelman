name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 服务列表从目录结构推出来，所以新增服务只需要建
  # services/<name>/service.mk，不需要改这个 workflow。
  discover:
    name: 发现服务
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 列出 services/*/service.mk
        id: list
        run: |
          set -euo pipefail
          names=""
          for file in services/*/service.mk; do
            [ -e "${file}" ] || continue
            names="${names}${names:+,}$(basename "$(dirname "${file}")")"
          done
          if [ -z "${names}" ]; then
            echo "没有找到任何 services/*/service.mk" >&2
            exit 1
          fi
          echo "发现服务：${names}"
          echo "services=$(printf '%s' "${names}" | jq -Rc 'split(",")')" >> "${GITHUB_OUTPUT}"

  lint:
    name: 格式与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # 文档一致性：链接、契约表与 design.md 对齐、过期口径（tools/docs_check.py）。
      - name: 文档一致性
        run: make docs-check

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 与 target
        # MNN 走 ocr-rs 的预编译归档，不再从源码构建，因此缓存命中后
        # 一次完整构建通常在数分钟内完成。
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: ". -> target"

      - name: 格式检查
        run: make fmt-check

      - name: 静态检查
        run: make clippy

  service:
    name: 服务 ${{ matrix.service }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    env:
      # 注入构建溯源，/version 与镜像 tag 都用它
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # Rust 工具链与缓存对非 Rust 服务是空转，代价是几步几十秒；
      # 换来的是一条 job 定义覆盖所有技术栈。
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 与 target
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          workspaces: ". -> target"

      - name: 单元测试、契约测试与 HTTP 测试
        # 契约测试会真实加载模型并对固定样本做推理，这是模型变更的门禁。
        # 具体跑什么由 services/${{ matrix.service }}/service.mk 决定。
        run: make test SERVICE=${{ matrix.service }}

      - name: 构建镜像
        run: make image SERVICE=${{ matrix.service }} TAG=ci

      - name: 容器冒烟测试
        run: make smoke SERVICE=${{ matrix.service }} TAG=ci PORT=18080

      - name: 显示镜像体积
        run: docker images modelman-${{ matrix.service }}:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
